<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"
     aria-label="Stylised map of the Maryland, Washington DC and Virginia service area, with the Chesapeake Bay and principal markets marked.">
  <rect width="800" height="560" fill="#0d1216"/>
  <g stroke="rgba(255,255,255,.05)" stroke-width="1">
    <path d="M0 70h800M0 140h800M0 210h800M0 280h800M0 350h800M0 420h800M0 490h800"/>
    <path d="M70 0v560M140 0v560M210 0v560M280 0v560M350 0v560M420 0v560M490 0v560M560 0v560M630 0v560M700 0v560"/>
  </g>

  <!-- land mass, west of the bay -->
  <path d="M60 120c90-34 190-42 268-22 44 12 74 34 106 52 26 14 44 34 40 62-6 40-40 66-46 106-6 40 4 78-18 108-24 32-78 40-128 34-52-6-96-30-134-64-36-32-58-74-66-118-8-46-4-96-22-138z"
        fill="#151d24" stroke="#2a343d" stroke-width="2"/>
  <!-- eastern shore -->
  <path d="M596 168c40-10 78-6 104 14 22 18 26 50 18 84-8 36-28 66-30 104-2 34 8 66-14 88-20 20-56 20-84 6-26-14-42-40-44-70-2-40 14-78 20-118 6-38 2-80 30-108z"
        fill="#131a20" stroke="#2a343d" stroke-width="2"/>
  <!-- chesapeake bay -->
  <path d="M474 132c26 22 34 56 30 92-4 40-24 74-28 114-4 38 6 76-12 108-12 22-34 34-52 30 22-30 20-72 22-110 2-42 18-80 22-120 4-38-4-76-16-108 12-4 24-4 34-6z"
        fill="#0a1218" stroke="#233039" stroke-width="2"/>
  <!-- potomac -->
  <path d="M470 350c-34-6-64-26-96-40-30-12-64-16-96-30" fill="none"
        stroke="#0a1218" stroke-width="9" stroke-linecap="round"/>

  <!-- principal corridors -->
  <g stroke="#f0a11a" stroke-width="2" opacity="0.4" fill="none" stroke-dasharray="8 7">
    <path d="M300 250L392 300 448 356"/>
    <path d="M392 300L268 344"/>
    <path d="M448 356L556 396"/>
    <path d="M392 300L430 210"/>
  </g>

  <!-- markets -->
  <g fill="#f0a11a">
    <circle cx="392" cy="300" r="9"/>
    <circle cx="448" cy="356" r="7"/>
    <circle cx="300" cy="250" r="7"/>
    <circle cx="268" cy="344" r="7"/>
    <circle cx="430" cy="210" r="7"/>
    <circle cx="556" cy="396" r="7"/>
  </g>
  <g fill="none" stroke="#f0a11a" stroke-width="2" opacity="0.35">
    <circle cx="392" cy="300" r="22"/>
    <circle cx="448" cy="356" r="18"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c3ccd4">
    <text x="392" y="284" text-anchor="middle">Baltimore</text>
    <text x="470" y="380" text-anchor="start">Annapolis</text>
    <text x="430" y="196" text-anchor="middle">Frederick</text>
    <text x="252" y="368" text-anchor="middle">N. Virginia</text>
    <text x="300" y="236" text-anchor="middle">Western MD</text>
    <text x="576" y="392" text-anchor="start">Eastern Shore</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">
    <text x="352" y="332" text-anchor="middle">WASHINGTON DC</text>
  </g>
  <circle cx="352" cy="316" r="6" fill="#ffffff"/>

  <g transform="translate(724 496)" fill="#8f9ba6">
    <path d="M0-24L7 6 0 0-7 6z" fill="#f0a11a"/>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">N</text>
  </g>
</svg>
